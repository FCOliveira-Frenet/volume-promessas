<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Volume e promessas: transportadoras</title>
<style>
    :root {
      --bg: #f4f4f5; --card: #ffffff; --line: #e4e4e7; --ink: #18181b; --muted: #71717a; --faint: #a1a1aa;
      --dark: #141518; --dark-line: #2a2b31; --dark-muted: #9a9ca6; --dark-faint: #6b6e78;
      --pink: #f29cb3; --green: #3fcf8e; --amber: #f5b14b; --blue: #7aa7ff; --violet: #b49cf2; --teal: #5fd0c7; --sand: #d8b47a; --gray: #9a9ca6;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.45; font-size: 14px; }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 6px; }
    .sub { color: var(--muted); max-width: 78ch; margin: 0 0 18px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .tab { border: 0; border-radius: 999px; padding: 9px 16px; background: #e9e9ec; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
    .tab.active { background: var(--dark); color: #fff; }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); margin-bottom: 16px; }
    .filter { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
    .filter select { border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--ink); padding: 2px 0; }
    .filter small { color: var(--faint); font-size: 11px; }
    .hero { display: grid; grid-template-columns: 1.05fr 2fr; background: var(--dark); color: #fff; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
    .hero-main { padding: 28px 26px; border-right: 1px solid var(--dark-line); display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dark-muted); font-weight: 600; }
    .headline { font-family: Georgia, "Iowan Old Style", serif; font-weight: 400; font-size: clamp(52px, 7vw, 76px); line-height: 1; color: var(--pink); margin: 10px 0 8px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .headline.good { color: var(--green); }
    .hero-main .meta { color: var(--dark-muted); font-size: 13px; }
    .track { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--dark-line); margin: 22px 0 12px; }
    .track i { display: block; height: 100%; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--dark-muted); }
    .legend b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
    .legend strong { color: #fff; font-weight: 600; margin-left: 4px; }
    .chip { display: inline-block; margin-top: 18px; background: #1f2a24; color: var(--green); border-radius: 999px; padding: 6px 12px; font-size: 12px; }
    .kpis { display: grid; grid-template-columns: 1fr 1fr; }
    .kpi { padding: 22px 24px; border-bottom: 1px solid var(--dark-line); }
    .kpi:nth-child(odd) { border-right: 1px solid var(--dark-line); }
    .kpi:nth-last-child(-n+2) { border-bottom: 0; }
    .kpi .eyebrow { display: flex; align-items: center; gap: 6px; }
    .kpi strong { display: block; font-size: 30px; font-weight: 650; letter-spacing: -0.03em; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
    .kpi strong.alert { color: var(--pink); }
    .kpi strong.good { color: var(--green); }
    .kpi em { font-style: normal; color: var(--dark-muted); font-size: 12px; }
    .info { display: inline-flex; width: 13px; height: 13px; border: 1px solid var(--dark-faint); border-radius: 50%; color: var(--dark-faint); font-size: 9px; align-items: center; justify-content: center; font-weight: 700; cursor: help; letter-spacing: 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); margin-top: 16px; }
    .card.top-blue { border-top: 3px solid #3b5bdb; }
    .card.top-amber { border-top: 3px solid #e8a33d; }
    .card h2 { font-size: 14px; font-weight: 650; margin: 0 0 14px; }
    .card h2 span { color: var(--muted); font-weight: 500; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .fact .eyebrow { color: var(--faint); }
    .fact strong { display: block; font-size: 24px; font-weight: 650; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .fact em { font-style: normal; color: var(--muted); font-size: 12px; }
    .note { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--faint); font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    td.name { font-weight: 600; }
    td.good { color: #15803d; } td.bad { color: #be123c; } td.warn { color: #b45309; }
    .wrap { overflow-x: auto; }
    h3 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; font-weight: 600; }
    svg.chart { width: 100%; height: auto; display: block; font-size: 10px; font-variant-numeric: tabular-nums; }
    svg.chart text { fill: var(--muted); }
    .clegend { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--muted); font-size: 12px; margin-top: 8px; }
    .clegend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .clegend i { display: inline-block; width: 18px; border-top: 2px dashed currentColor; margin-right: 5px; vertical-align: 3px; }
    .carrier-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .carrier-head h2 { font-size: 18px; margin: 0; }
    .pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 4px; }
    .pill { background: #f7f7f8; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .pill .eyebrow { color: var(--faint); font-size: 10px; }
    .pill strong { display: block; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
    .pill em { font-style: normal; font-size: 12px; color: var(--muted); }
    .pill.ok strong { color: #15803d; } .pill.warn strong { color: #b45309; } .pill.bad strong { color: #be123c; }
    .quality li { margin: 8px 0; color: var(--ink); }
    footer { margin-top: 22px; color: var(--faint); font-size: 12px; }
    .state { background: var(--card); border: 1px dashed var(--line); border-radius: 16px; padding: 28px; color: var(--muted); }
    @media (max-width: 900px) { .hero, .grid2, .pills { grid-template-columns: 1fr; } .hero-main { border-right: 0; border-bottom: 1px solid var(--dark-line); } }
  </style>
</head>
<body>
<main id="app"><p>Carregando o painel...</p></main>
<script src="data.js"></script>
<script>
(function(){var r=window.VOLUME_COMPACT;r.carriers.forEach(function(c){var out={};Object.keys(c.daily_by_month).forEach(function(m){var ca=0,cf=0;out[m]=c.daily_by_month[m].map(function(p){var d=m+"-"+String(p[0]).padStart(2,"0"),a=p[1],f=p[2];if(a!=null)ca+=a;if(f!=null)cf+=f;return {day:d,actual:a,forecast:f,cum_actual:a!=null?ca:null,cum_forecast:f!=null?cf:null};});});c.daily_by_month=out;});window.VOLUME=r;})();
</script>
<script>
/* Renders volume.html from the payload in volume.js (window.VOLUME).
   Three tabs (Resumo, Transportadoras, Dados), a filter bar (mês, transportadora)
   and a dark hero block. Charts are inline SVG. */
(function () {
  const MONTHS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const COLORS = { COR: "#7aa7ff", LOG: "#3fcf8e", JAD: "#d8b47a", JTE: "#f29cb3", OPT: "#b49cf2", IMI: "#5fd0c7", TEX: "#f5b14b", PEG: "#9a9ca6" };
  const TABS = [["resumo", "Resumo"], ["transportadoras", "Transportadoras"], ["dados", "Dados e qualidade"]];
  const MONTHS_IN_CARD = 6;
  const MIN_SLOT_FOR_LABEL = 34;
  const STALE_FORECAST_RATIO = 3;

  const num = (value, digits = 0) => value == null ? "–" : Number(value).toLocaleString("pt-BR", { maximumFractionDigits: digits });
  const brl = (value) => value == null ? "–" : Number(value).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const pct = (ratio, digits = 0) => ratio == null ? "–" : `${(ratio * 100).toLocaleString("pt-BR", { maximumFractionDigits: digits })}%`;
  const delta = (ratio) => ratio == null ? "–" : `${ratio > 0 ? "+" : ""}${(ratio * 100).toLocaleString("pt-BR", { maximumFractionDigits: 0 })}%`;
  const pp = (ratio) => ratio == null ? "–" : `${ratio > 0 ? "+" : ""}${(ratio * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} p.p.`;
  const short = (value) => value >= 1e6 ? `${num(value / 1e6, 1)} mi` : value >= 1000 ? `${num(value / 1000, value < 10000 ? 1 : 0)} mil` : num(value);
  const dayMonth = (iso) => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : "–";
  const monthLabel = (ym) => `${MONTHS[Number(ym.slice(5, 7)) - 1]}/${ym.slice(0, 4)}`;
  const sum = (list, pick) => list.reduce((total, item) => total + (pick(item) || 0), 0);
  const ratio = (part, whole) => part != null && whole ? part / whole : null;
  const cell = (value) => value == null ? "" : value >= 1 ? "good" : value >= 0.9 ? "warn" : "bad";
  const toneClass = (value) => value == null ? "" : value >= 1 ? "ok" : value >= 0.9 ? "warn" : "bad";
  const info = (text) => `<span class="info" title="${text}">i</span>`;

  const monthOf = (carrier, month) => carrier.monthly.find((entry) => entry.month === month) || null;
  const isPartial = (entry) => Boolean(entry && entry.in_progress);
  const expected = (entry) => entry ? (isPartial(entry) ? entry.projection : entry.actual) : null;
  const previousMonth = (ym) => {
    const [year, month] = ym.split("-").map(Number);
    return month === 1 ? `${year - 1}-12` : `${year}-${String(month - 1).padStart(2, "0")}`;
  };

  /* ---------- SVG helpers ---------- */
  const PAD = { l: 48, r: 12, t: 14, b: 26 };
  function scales(count, max, width, height) {
    const inner = width - PAD.l - PAD.r;
    return { slot: inner / Math.max(count, 1), x: (i) => PAD.l + (count > 1 ? (i / (count - 1)) * inner : inner / 2), y: (v) => height - PAD.b - (v / max) * (height - PAD.t - PAD.b) };
  }
  function grid(scale, max, width) {
    return [0, 0.25, 0.5, 0.75, 1].map((f) => { const y = scale.y(f * max).toFixed(1); return `<line x1="${PAD.l}" x2="${width - PAD.r}" y1="${y}" y2="${y}" stroke="#ececef"/><text x="${PAD.l - 6}" y="${Number(y) + 3}" text-anchor="end">${short(f * max)}</text>`; }).join("");
  }
  function path(values, xAt, yAt) {
    let d = "", pen = false;
    values.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${xAt(i).toFixed(1)} ${yAt(v).toFixed(1)} `; pen = true; });
    return d;
  }
  function xLabels(labels, xAt, height, every) {
    return labels.map((label, i) => i % every === 0 || i === labels.length - 1 ? `<text x="${xAt(i).toFixed(1)}" y="${height - 8}" text-anchor="middle">${label}</text>` : "").join("");
  }
  function lineChart({ labels, series, hlines = [], width = 1120, height = 260 }) {
    const values = [...series.flatMap((s) => s.values), ...hlines.map((h) => h.value)].filter((v) => v != null);
    if (!values.length) return `<p class="note">Sem dados para o período.</p>`;
    const max = Math.max(...values) * 1.05, scale = scales(labels.length, max, width, height);
    const lines = series.map((s) => `<path d="${path(s.values, scale.x, scale.y)}" fill="none" stroke="${s.color}" stroke-width="2.2" ${s.dash ? 'stroke-dasharray="6 4"' : ""} stroke-linejoin="round"/>`).join("");
    const refs = hlines.map((h) => `<line x1="${PAD.l}" x2="${width - PAD.r}" y1="${scale.y(h.value).toFixed(1)}" y2="${scale.y(h.value).toFixed(1)}" stroke="${h.color}" stroke-width="1.6" stroke-dasharray="3 4"/><text x="${width - PAD.r}" y="${(scale.y(h.value) - 4).toFixed(1)}" text-anchor="end" fill="${h.color}">${h.label}</text>`).join("");
    return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img">${grid(scale, max, width)}${refs}${lines}${xLabels(labels, scale.x, height, Math.ceil(labels.length / 10))}</svg>`;
  }
  function barChart({ labels, bars, partial = [], lines = [], color, width = 1120, height = 260 }) {
    const values = [...bars, ...lines.flatMap((l) => l.values)].filter((v) => v != null);
    if (!values.length) return `<p class="note">Sem dados para o período.</p>`;
    const max = Math.max(...values) * 1.12, scale = scales(labels.length, max, width, height);
    const center = (i) => PAD.l + scale.slot * (i + 0.5), barWidth = scale.slot * 0.62, every = scale.slot < MIN_SLOT_FOR_LABEL ? 2 : 1;
    const rects = bars.map((v, i) => v == null ? "" : `<rect x="${(center(i) - barWidth / 2).toFixed(1)}" y="${scale.y(v).toFixed(1)}" width="${barWidth.toFixed(1)}" height="${(scale.y(0) - scale.y(v)).toFixed(1)}" rx="3" fill="${color}" opacity="${partial[i] ? 0.35 : 0.9}"><title>${labels[i]}: ${num(v)}</title></rect>${(bars.length - 1 - i) % every === 0 ? `<text x="${center(i).toFixed(1)}" y="${(scale.y(v) - 3).toFixed(1)}" text-anchor="middle" font-size="8.5">${short(v)}</text>` : ""}`).join("");
    const steps = lines.map((l) => `<path d="${path(l.values, center, scale.y)}" fill="none" stroke="${l.color}" stroke-width="2" ${l.dash ? 'stroke-dasharray="6 4"' : ""}/>`).join("");
    return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img">${grid(scale, max, width)}${rects}${steps}${xLabels(labels, center, height, Math.ceil(labels.length / 11))}</svg>`;
  }
  function stackedChart({ months, carriers, width = 1120, height = 280 }) {
    const totals = months.map((m) => sum(carriers, (c) => (monthOf(c, m) || {}).actual));
    const max = Math.max(...totals, 1) * 1.1, scale = scales(months.length, max, width, height), barWidth = scale.slot * 0.66;
    const columns = months.map((m, i) => {
      let top = 0; const x = (PAD.l + scale.slot * (i + 0.5) - barWidth / 2).toFixed(1);
      const parts = carriers.map((c) => { const e = monthOf(c, m); if (!e || !e.actual) return ""; top += e.actual; return `<rect x="${x}" y="${scale.y(top).toFixed(1)}" width="${barWidth.toFixed(1)}" height="${(scale.y(0) - scale.y(e.actual)).toFixed(1)}" fill="${COLORS[c.code]}" opacity="${isPartial(e) ? 0.55 : 0.95}"><title>${c.name} · ${monthLabel(m)}: ${num(e.actual)}</title></rect>`; }).join("");
      return `${parts}<text x="${(Number(x) + barWidth / 2).toFixed(1)}" y="${(scale.y(top) - 4).toFixed(1)}" text-anchor="middle" font-weight="600">${short(top)}</text>`;
    }).join("");
    return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img">${grid(scale, max, width)}${columns}${months.map((m, i) => `<text x="${(PAD.l + scale.slot * (i + 0.5)).toFixed(1)}" y="${height - 8}" text-anchor="middle">${monthLabel(m)}</text>`).join("")}</svg>`;
  }

  /* ---------- page chrome ---------- */
  function chrome(report, state) {
    const options = [...report.months].reverse().map((m) => `<option value="${m}" ${m === state.month ? "selected" : ""}>${monthLabel(m)}</option>`).join("");
    const carriers = report.carriers.map((c) => `<option value="${c.code}" ${c.code === state.carrier ? "selected" : ""}>${c.name}</option>`).join("");
    return `<header>
      <h1>${report.title}</h1>
      <p class="sub">${report.subtitle}</p>
      <div class="tabs">${TABS.map(([id, label]) => `<button class="tab ${id === state.tab ? "active" : ""}" data-tab="${id}">${label}</button>`).join("")}</div>
      <div class="filters">
        <label class="filter">Mês <select id="month">${options}</select></label>
        <label class="filter">Transportadora <select id="carrier"><option value="">Todas</option>${carriers}</select><small>${state.carrier ? "" : "Pegaki fora do total"}</small></label>
        <span class="filter">Fonte <strong>datalake</strong><small>pagamento</small></span>
      </div>
    </header>`;
  }

  /* ---------- hero: network or one carrier ---------- */
  function heroNetwork(report, month) {
    const main = report.carriers.filter((c) => c.counts_in_total);
    const rows = main.map((c) => ({ c, e: monthOf(c, month) })).filter((r) => r.e && r.e.actual != null);
    const actual = sum(rows, (r) => r.e.actual), cost = sum(rows, (r) => r.e.cost);
    const withForecast = rows.filter((r) => r.e.forecast_to_date);
    const attain = ratio(sum(withForecast, (r) => r.e.actual), sum(withForecast, (r) => r.e.forecast_to_date));
    const prevRows = main.map((c) => monthOf(c, previousMonth(month))).filter(Boolean);
    const prevWith = prevRows.filter((e) => e.forecast_to_date);
    const prevAttain = ratio(sum(prevWith, (e) => e.actual), sum(prevWith, (e) => e.forecast_to_date));
    const previous = sum(prevRows, (e) => e.actual);
    const projected = sum(rows, (r) => expected(r.e));
    const promised = rows.filter((r) => r.e.promise);
    const promiseHit = promised.filter((r) => r.e.attainment_promise >= 1).length;
    const partial = rows.some((r) => isPartial(r.e));
    const segments = rows.slice().sort((a, b) => b.e.actual - a.e.actual).map((r) => ({ name: r.c.name, color: COLORS[r.c.code], value: r.e.actual }));
    return `<section class="hero">
      <div class="hero-main">
        <p class="eyebrow">Realizado vs previsto · rede</p>
        <p class="headline ${attain >= 1 ? "good" : ""}">${pct(attain, 1)}</p>
        <p class="meta">${prevAttain != null ? `${pp(attain - prevAttain)} vs ${monthLabel(previousMonth(month))}` : "sem base anterior"} · ${num(sum(withForecast, (r) => r.e.actual))} de ${num(sum(withForecast, (r) => r.e.forecast_to_date))} previstas</p>
        <div class="track">${segments.map((s) => `<i style="background:${s.color};width:${(s.value / actual) * 100}%"></i>`).join("")}</div>
        <div class="legend">${segments.slice(0, 5).map((s) => `<span><b style="background:${s.color}"></b>${s.name}<strong>${pct(s.value / actual)}</strong></span>`).join("")}</div>
        <span class="chip">${partial ? "Mês em andamento" : "Mês fechado"} · ${num(actual)} etiquetas pagas</span>
      </div>
      <div class="kpis">
        ${kpi("Etiquetas pagas", num(actual), partial ? `parcial, projeção ${num(projected)}` : "mês fechado", "Pedidos com data de pagamento no mês, sem Pegaki")}
        ${kpi("Previsto até a data", num(sum(withForecast, (r) => r.e.forecast_to_date)), `${withForecast.length} de ${main.length} transportadoras com previsão`, "Soma da previsão diária da planilha nos dias já reportados")}
        ${kpi("Custo das transportadoras", brl(cost), `${brl(ratio(cost, actual))} por etiqueta`, "ShippingRealPrice somado nos pedidos pagos")}
        ${kpi("Vs mês anterior", delta(previous ? projected / previous - 1 : null), `${num(projected)} contra ${num(previous)}`, "Fechamento (ou projeção) comparado ao mês anterior", previous && projected / previous - 1 < 0 ? "alert" : "good")}
        ${kpi("Abaixo da previsão", num(withForecast.filter((r) => r.e.attainment_forecast < 0.9).length), `de ${withForecast.length} com previsão · < 90%`, "Transportadoras com realizado abaixo de 90% do previsto até a data", withForecast.some((r) => r.e.attainment_forecast < 0.9) ? "alert" : "good")}
        ${kpi("Promessas batidas", promised.length ? `${promiseHit} de ${promised.length}` : "–", promised.length ? promised.map((r) => `${r.c.name} ${pct(r.e.attainment_promise)}`).join(" · ") : "nenhuma promessa mensal na planilha", "Transportadoras com promessa mensal cadastrada e realizado acima dela", promised.length && promiseHit < promised.length ? "alert" : "good")}
      </div>
    </section>`;
  }

  function heroCarrier(carrier, month) {
    const e = monthOf(carrier, month);
    if (!e || e.actual == null) return `<section class="state"><h2>${carrier.name} sem volume em ${monthLabel(month)}</h2></section>`;
    const prev = monthOf(carrier, previousMonth(month));
    const base = e.promise ? e.attainment_promise : e.attainment_forecast;
    const prevBase = prev ? (e.promise ? prev.attainment_promise : prev.attainment_forecast) : null;
    const weeks = carrier.weekly.filter((w) => w.days_reported === 7).slice(-4);
    return `<section class="hero">
      <div class="hero-main">
        <p class="eyebrow">${e.promise ? "Realizado vs promessa" : "Realizado vs previsto"} · ${carrier.name}</p>
        <p class="headline ${base >= 1 ? "good" : ""}">${pct(base, 1)}</p>
        <p class="meta">${prevBase != null ? `${pp(base - prevBase)} vs ${monthLabel(previousMonth(month))}` : "sem base anterior"} · ${num(e.actual)} de ${num(e.promise || e.forecast_to_date)} ${e.promise ? "prometidas" : "previstas"}</p>
        <div class="track"><i style="background:${COLORS[carrier.code]};width:${Math.min(100, (base || 0) * 100)}%"></i></div>
        <div class="legend">${weeks.map((w) => `<span>${w.label.replace(/\s*\(.*\)/, "")}<strong>${short(w.actual)}</strong></span>`).join("")}</div>
        <span class="chip">${carrier.role}${carrier.counts_in_total ? "" : " · fora do total"}</span>
      </div>
      <div class="kpis">
        ${kpi("Etiquetas pagas", num(e.actual), isPartial(e) ? `até ${dayMonth(e.last_reported_day)} · projeção ${num(e.projection)}` : "mês fechado", "Pedidos com data de pagamento no mês")}
        ${kpi("Previsto até a data", num(e.forecast_to_date), e.forecast_to_date ? `${pct(e.attainment_forecast)} realizado` : "sem previsão na planilha", "Previsão diária da planilha somada nos dias reportados", e.forecast_to_date && e.attainment_forecast < 0.9 ? "alert" : "")}
        ${kpi("Promessa do mês", num(e.promise), e.promise ? `${pct(e.attainment_promise)} realizado` : "sem promessa na planilha", "Prom. Etiq. Mês da planilha", e.promise && e.attainment_promise < 1 ? "alert" : e.promise ? "good" : "")}
        ${kpi("Vs mês anterior", delta(prev && prev.actual ? expected(e) / prev.actual - 1 : null), prev ? `${num(prev.actual)} em ${monthLabel(previousMonth(month))}` : "sem mês anterior", "Fechamento comparado ao mês anterior", prev && prev.actual && expected(e) < prev.actual ? "alert" : "good")}
        ${kpi("Custo", brl(e.cost || null), `${brl(e.cost_per_label)} por etiqueta`, "ShippingRealPrice somado nos pedidos pagos")}
        ${kpi("Meta semanal", weeks.length && weeks[weeks.length - 1].target ? num(weeks[weeks.length - 1].target) : "–", weeks.length && weeks[weeks.length - 1].target ? `última semana cheia: ${num(weeks[weeks.length - 1].actual)} (${pct(weeks[weeks.length - 1].actual / weeks[weeks.length - 1].target)})` : "sem meta semanal na planilha", "Meta da tabela lateral da planilha", weeks.length && weeks[weeks.length - 1].target && weeks[weeks.length - 1].actual < weeks[weeks.length - 1].target ? "alert" : "")}
      </div>
    </section>`;
  }

  function kpi(label, value, note, help, tone = "") {
    return `<div class="kpi"><p class="eyebrow">${label} ${info(help)}</p><strong class="${tone}">${value}</strong><em>${note}</em></div>`;
  }

  /* ---------- resumo tab ---------- */
  function highlights(report, month) {
    // A forecast an order of magnitude below the actual is stale (Optimus ramped up after the sheet stopped); it would top every ranking.
    const rows = report.carriers.filter((c) => c.counts_in_total).map((c) => ({ c, e: monthOf(c, month) })).filter((r) => r.e && r.e.forecast_to_date && r.e.attainment_forecast < STALE_FORECAST_RATIO);
    const sorted = rows.slice().sort((a, b) => a.e.attainment_forecast - b.e.attainment_forecast);
    const byVolume = rows.slice().sort((a, b) => (b.e.actual - b.e.forecast_to_date) - (a.e.actual - a.e.forecast_to_date));
    const gapBelow = byVolume[byVolume.length - 1], gapAbove = byVolume[0];
    const fact = (label, value, note) => `<div class="fact"><p class="eyebrow">${label}</p><strong>${value}</strong><em>${note}</em></div>`;
    return `<div class="grid2">
      <section class="card top-blue"><h2>Abaixo da previsão <span>· quem ficou mais longe</span></h2><div class="facts">
        ${sorted.length ? fact("Menor atingimento", `${sorted[0].c.name} · ${pct(sorted[0].e.attainment_forecast)}`, `${num(sorted[0].e.actual)} de ${num(sorted[0].e.forecast_to_date)} previstas`) : ""}
        ${gapBelow ? fact("Maior volume faltante", `${gapBelow.c.name} · ${num(gapBelow.e.forecast_to_date - gapBelow.e.actual)}`, "etiquetas abaixo do previsto") : ""}
      </div></section>
      <section class="card top-amber"><h2>Acima da previsão <span>· quem puxou o mês</span></h2><div class="facts">
        ${sorted.length ? fact("Maior atingimento", `${sorted[sorted.length - 1].c.name} · ${pct(sorted[sorted.length - 1].e.attainment_forecast)}`, `${num(sorted[sorted.length - 1].e.actual)} de ${num(sorted[sorted.length - 1].e.forecast_to_date)} previstas`) : ""}
        ${gapAbove && gapAbove.e.actual > gapAbove.e.forecast_to_date ? fact("Maior volume excedente", `${gapAbove.c.name} · ${num(gapAbove.e.actual - gapAbove.e.forecast_to_date)}`, "etiquetas acima do previsto") : fact("Maior volume excedente", "–", "ninguém acima do previsto")}
      </div></section>
    </div>`;
  }

  function comparison(report, month) {
    const rows = report.carriers.map((c) => ({ c, e: monthOf(c, month), p: monthOf(c, previousMonth(month)) })).filter((r) => r.e)
      .sort((a, b) => (b.c.counts_in_total - a.c.counts_in_total) || ((b.e.actual || 0) - (a.e.actual || 0)));
    const line = ({ c, e, p }) => { const change = p && p.actual ? expected(e) / p.actual - 1 : null; return `<tr>
      <td class="name">${c.name}${c.counts_in_total ? "" : " <span style='color:var(--faint);font-weight:500'>rede de postagem</span>"}</td>
      <td>${num(e.actual)}</td><td>${e.days_reported}/${e.days_in_month}</td>
      <td>${num(e.forecast_to_date)}</td><td class="${cell(e.attainment_forecast)}">${pct(e.attainment_forecast)}</td>
      <td>${num(e.promise)}</td><td class="${cell(e.attainment_promise)}">${pct(e.attainment_promise)}</td>
      <td>${num(p && p.actual)}</td><td class="${change == null ? "" : change >= 0 ? "good" : "bad"}">${delta(change)}</td>
      <td>${brl(e.cost || null)}</td><td>${brl(e.cost_per_label)}</td></tr>`; };
    return `<section class="card"><h2>Comparativo de ${monthLabel(month)}</h2>
      <p class="note">"Previsto até a data" soma a previsão da planilha apenas dos dias já reportados. A variação compara o fechamento (ou a projeção) com o mês anterior.</p>
      <div class="wrap"><table><thead><tr><th>Transportadora</th><th>Etiquetas pagas</th><th>Dias</th><th>Previsto até a data</th><th>% prev.</th><th>Promessa</th><th>% prom.</th><th>Mês anterior</th><th>Variação</th><th>Custo real</th><th>Custo/etiq.</th></tr></thead><tbody>${rows.map(line).join("")}</tbody></table></div></section>`;
  }

  function evolution(report) {
    const carriers = report.carriers.filter((c) => c.counts_in_total);
    return `<section class="card"><h2>Evolução mensal das etiquetas pagas <span>· sem Pegaki</span></h2>
      ${stackedChart({ months: report.months, carriers })}
      <div class="clegend">${carriers.map((c) => `<span><b style="background:${COLORS[c.code]}"></b>${c.name}</span>`).join("")}</div></section>`;
  }

  /* ---------- transportadoras tab ---------- */
  function card(carrier, month) {
    const e = monthOf(carrier, month);
    if (!e || e.actual == null) return `<section class="card"><div class="carrier-head"><h2>${carrier.name}</h2><span class="note">${carrier.role}</span></div><p class="note">Sem volume em ${monthLabel(month)}.</p></section>`;
    const points = carrier.daily_by_month[e.month] || [];
    const weeks = carrier.weekly;
    const index = carrier.monthly.findIndex((m) => m.month === month);
    const recent = carrier.monthly.slice(Math.max(0, index - MONTHS_IN_CARD + 1), index + 1).reverse();
    const pill = (label, value, note, tone = "") => `<div class="pill ${tone}"><p class="eyebrow">${label}</p><strong>${value}</strong><em>${note}</em></div>`;
    return `<section class="card">
      <div class="carrier-head"><h2>${carrier.name}</h2><span class="note">${carrier.role}${carrier.counts_in_total ? "" : " · fora do total"}</span></div>
      <div class="pills">
        ${pill("Etiquetas pagas", num(e.actual), isPartial(e) ? `até ${dayMonth(e.last_reported_day)}` : "mês fechado")}
        ${pill("Previsto até a data", num(e.forecast_to_date), e.forecast_to_date ? `${pct(e.attainment_forecast)} realizado` : "sem previsão", toneClass(e.attainment_forecast))}
        ${pill("Promessa", num(e.promise), e.promise ? `${pct(e.attainment_promise)} realizado` : "sem promessa", toneClass(e.attainment_promise))}
        ${pill("Custo por etiqueta", brl(e.cost_per_label), brl(e.cost || null))}
      </div>
      <h3>Acumulado em ${monthLabel(month)}</h3>
      ${lineChart({ labels: points.map((p) => p.day.slice(8, 10)), series: [{ values: points.map((p) => p.cum_forecast), color: "#9ca3af", dash: true }, { values: points.map((p) => p.cum_actual), color: COLORS[carrier.code] }], hlines: e.promise ? [{ value: e.promise, color: "#e8a33d", label: `Promessa ${short(e.promise)}` }] : [] })}
      <div class="clegend"><span><b style="background:${COLORS[carrier.code]}"></b>Realizado acumulado</span><span style="color:#9ca3af"><i></i>Previsto acumulado</span>${e.promise ? `<span style="color:#e8a33d"><i></i>Promessa mensal</span>` : ""}</div>
      <h3>Etiquetas pagas por semana · ${weeks.length} semanas, domingo a sábado</h3>
      ${barChart({ labels: weeks.map((w) => w.label.replace(/\s*\(.*\)/, "")), bars: weeks.map((w) => w.actual), partial: weeks.map((w) => w.days_reported < 7), lines: [{ values: weeks.map((w) => w.target), color: "#e8a33d" }, { values: weeks.map((w) => w.next_target), color: "#be123c", dash: true }], color: COLORS[carrier.code] })}
      <div class="clegend"><span><b style="background:${COLORS[carrier.code]}"></b>Semana</span><span><b style="background:${COLORS[carrier.code]};opacity:.35"></b>Semana incompleta</span><span style="color:#e8a33d"><i style="border-top-style:solid"></i>Meta semanal</span><span style="color:#be123c"><i></i>Próxima meta</span></div>
      <h3>Últimos meses</h3>
      <table><thead><tr><th>Mês</th><th>Etiquetas</th><th>Previsto</th><th>Promessa</th><th>Custo/etiq.</th><th>Var. m/m</th></tr></thead><tbody>${recent.map((m) => { const p = monthOf(carrier, previousMonth(m.month)); const ch = p && p.actual && m.actual != null ? expected(m) / p.actual - 1 : null; return `<tr><td>${monthLabel(m.month)}${isPartial(m) ? " <span style='color:var(--faint)'>parcial</span>" : ""}</td><td>${num(m.actual)}</td><td>${num(m.forecast)}</td><td>${num(m.promise)}</td><td>${brl(m.cost_per_label)}</td><td class="${ch == null ? "" : ch >= 0 ? "good" : "bad"}">${delta(ch)}</td></tr>`; }).join("")}</tbody></table>
    </section>`;
  }

  /* ---------- dados tab ---------- */
  function dados(report) {
    return `<section class="card"><h2>Qualidade dos dados</h2><ul class="quality">${report.quality_notes.map((n) => `<li>${n}</li>`).join("")}</ul></section>
      <section class="card"><h2>Definições</h2><ul class="quality">${Object.values(report.definitions).map((d) => `<li>${d}</li>`).join("")}</ul></section>`;
  }

  /* ---------- state & mount ---------- */
  function render(report, state) {
    if (!report.carriers || !report.carriers.length) return `<section class="state"><h2>Sem transportadoras</h2></section>`;
    const selected = report.carriers.find((c) => c.code === state.carrier) || null;
    const hero = selected ? heroCarrier(selected, state.month) : heroNetwork(report, state.month);
    let body = "";
    if (state.tab === "resumo") body = selected ? card(selected, state.month) : `${highlights(report, state.month)}${comparison(report, state.month)}${evolution(report)}`;
    else if (state.tab === "transportadoras") body = (selected ? [selected] : report.carriers).map((c) => card(c, state.month)).join("");
    else body = dados(report);
    return `${chrome(report, state)}${hero}${body}<footer>Gerado em ${new Date(report.generated_at).toLocaleString("pt-BR")} · ${report.source_file}</footer>`;
  }

  function remember(state) {
    try {
      const url = new URL(window.location.href);
      url.searchParams.set("month", state.month); url.searchParams.set("tab", state.tab);
      if (state.carrier) url.searchParams.set("carrier", state.carrier); else url.searchParams.delete("carrier");
      window.history.replaceState(null, "", url);
    } catch (error) { /* file:// pages refuse this; nothing else changes */ }
  }

  function mount(state) {
    const app = document.querySelector("#app");
    try {
      app.innerHTML = render(window.VOLUME || {}, state);
      app.querySelector("#month").addEventListener("change", (ev) => mount({ ...state, month: ev.target.value }));
      app.querySelector("#carrier").addEventListener("change", (ev) => mount({ ...state, carrier: ev.target.value }));
      app.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => mount({ ...state, tab: b.dataset.tab })));
      remember(state);
      window.scrollTo({ top: Math.min(window.scrollY, 0) });
    } catch (error) {
      app.innerHTML = `<section class="state"><h2>Não foi possível montar a visualização</h2><p>${error.message}</p></section>`;
    }
  }

  function initial(report) {
    const q = new URLSearchParams(window.location.search);
    const month = (report.months || []).includes(q.get("month")) ? q.get("month") : report.focus_month;
    const tab = TABS.some(([id]) => id === q.get("tab")) ? q.get("tab") : "resumo";
    const carrier = (report.carriers || []).some((c) => c.code === q.get("carrier")) ? q.get("carrier") : "";
    return { month, tab, carrier };
  }

  mount(initial(window.VOLUME || {}));
})();

</script>
</body>
</html>
